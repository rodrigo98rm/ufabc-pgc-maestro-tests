appId: com.pgcapp
name: Login
---
- launchApp
- tapOn:
      id: "email-input"
- inputText: "rodrigo@teste.com"
- tapOn:
      id: "password-input"
- inputText: 12345
- tapOn:
      id: "login-button"
- assertVisible: "Login Inválido"
- tapOn:
      text: "OK"
- tapOn:
      id: "password-input"
- eraseText
- inputText: 123456
- tapOn:
      id: "login-button"
- assertVisible: "Notas"
