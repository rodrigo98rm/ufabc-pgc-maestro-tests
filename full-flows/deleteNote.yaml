appId: com.pgcapp
name: Delete Note
env:
  NOTE_TITLE: "Nota a ser apagada"
  NOTE_DESCRIPTION: "Descricao da nota a ser apagada"
---
- runFlow:
    file: ../full-flows/createNote.base.yaml
    env:
      NOTE_TITLE: ${NOTE_TITLE}
      NOTE_DESCRIPTION: ${NOTE_DESCRIPTION}
- tapOn: ${NOTE_TITLE}
- tapOn:
    id: "delete-note-button"
- tapOn: "Apagar"
- assertVisible:
    id: "new-note-button"
- assertNotVisible: ${NOTE_TITLE}
